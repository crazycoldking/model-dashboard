# AI Model Monitoring Dashboard Configuration

# Data sources configuration
data_sources:
  # Hugging Face platform - Top 10k models by downloads
  huggingface:
    enabled: true
    base_url: "https://huggingface.co"
    api_url: "https://huggingface.co/api"
    models_per_page: 100
    max_models: 10000
    
  # GitHub repositories
  github:
    enabled: true
    min_stars: 1000
    topics:
      - "machine-learning"
      - "deep-learning"
      - "artificial-intelligence"
      - "nlp"
      - "computer-vision"
      - "transformer"
      - "llm"
    max_repos: 100
    
  # Alibaba ModelScope
  modelscope:
    enabled: true
    base_url: "https://modelscope.cn"
    api_url: "https://modelscope.cn/api/v1"
    models_per_page: 20
    max_pages: 5
  
  # LiteLLM - Community-maintained list of 1000+ models with deprecation dates
  litellm:
    enabled: true
    json_url: "https://raw.githubusercontent.com/BerriAI/litellm/main/model_prices_and_context_window.json"
  
  # OpenAI API (requires OPENAI_API_KEY environment variable)
  openai:
    enabled: false
    api_url: "https://api.openai.com/v1/models"
    # api_key can be set here or via OPENAI_API_KEY env var
  
  # Anthropic API (requires ANTHROPIC_API_KEY environment variable)
  anthropic:
    enabled: false
    api_url: "https://api.anthropic.com/v1/models"
    # api_key can be set here or via ANTHROPIC_API_KEY env var
  
  # Mistral API (requires MISTRAL_API_KEY environment variable)
  mistral:
    enabled: false
    api_url: "https://api.mistral.ai/v1/models"
    # api_key can be set here or via MISTRAL_API_KEY env var
  
  # Google Gemini API (requires GEMINI_API_KEY environment variable)
  gemini:
    enabled: false
    api_url: "https://generativelanguage.googleapis.com/v1beta/models"
    # api_key can be set here or via GEMINI_API_KEY env var
  
  # Cohere API (requires COHERE_API_KEY environment variable)
  cohere:
    enabled: false
    api_url: "https://api.cohere.com/v1/models"
    # api_key can be set here or via COHERE_API_KEY env var

# Model status configuration
model_status:
  # Consider model deprecated if no updates in months
  deprecated_months: 6
  # Keywords indicating deprecation
  deprecated_keywords:
    - "deprecated"
    - "obsolete"
    - "archived"
    - "discontinued"
    - "legacy"
    - "淘汰"
    - "废弃"

# Task types mapping
task_types:
  - "text-classification"
  - "text-generation"
  - "text-to-text"
  - "translation"
  - "summarization"
  - "question-answering"
  - "image-classification"
  - "image-generation"
  - "image-to-text"
  - "object-detection"
  - "speech-recognition"
  - "text-to-speech"
  - "multimodal"
  - "reinforcement-learning"
  - "other"

# Output configuration
output:
  data_dir: "data"
  models_file: "models.json"
  timestamp_format: "%Y-%m-%d %H:%M:%S"
  
# GitHub Pages configuration
pages:
  title: "AI Model Monitoring Dashboard"
  description: "Real-time tracking of AI models across major platforms"
  items_per_page: 50
